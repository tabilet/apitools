  /api/v3/users/ssh-keys/:
    get:
      operationId: api_v3_users_ssh_keys_list
      description: |-
        List the SSH keys belonging to the authenticated client.

        **Permissions:** Any authenticated user with an Air scope.
      summary: List SSH keys
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -created
          - -modified
          - -name
          - created
          - modified
          - name
        description: Order SSH keys by field. Prefix with "-" for descending order.
      - in: query
        name: search
        schema:
          type: string
        description: Search SSH keys by `name`.
      tags:
      - SSH Keys
      responses:
        '200':
          content:
            application/json:
