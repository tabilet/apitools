  /api/v3/marketplace/demos/:
    get:
      operationId: api_v3_marketplace_demos_list
      description: |-
        List marketplace demos visible to your account.

        **Permissions:** Any authenticated user with an Air scope.
      summary: List visible marketplace demos
      parameters:
      - in: query
        name: creator
        schema:
          type: string
        description: Filter by the e-mail of the Marketplace Demo creator.
      - in: query
        name: demo_simulation_state
        schema:
          type: string
        description: Filter by the state of the associated demo simulation.
      - in: query
        name: liked_by_client
        schema:
          type: boolean
        description: Filter by whether the client has liked the Marketplace Demo.
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -created
          - -creator
          - -demo_simulation_state
          - -like_count
          - -liked_by_client
          - -modified
          - -name
          - -published
          - created
          - creator
          - demo_simulation_state
          - like_count
          - liked_by_client
          - modified
          - name
          - published
        description: Order marketplace demos by field. Prefix with "-" for descending
          order.
      - in: query
        name: published
        schema:
          type: boolean
      - in: query
        name: search
        schema:
          type: string
        description: Search marketplace demos by `name` or `description`.
      - in: query
        name: tags
        schema:
          type: array
          items:
            type: string
        description: Look up all Marketplace Demos by one or more comma-delimited
          tag names. If any of the tags is present on the Marketplace Demo, the Marketplace
          Demo will be returned.
        explode: false
        style: form
      tags:
      - Marketplace
