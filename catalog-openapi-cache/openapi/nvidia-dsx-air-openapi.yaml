    NicModelEnum:
      enum:
      - virtio
      - e1000
      type: string
      description: |-
        * `virtio` - VirtIO
        * `e1000` - Intel E1000
    NodeAdvancedField:
      type: object
      description: Advanced configuration associated with the node.
      properties:
        nic_model:
          allOf:
          - $ref: '#/components/schemas/NicModelEnum'
          default: virtio
          description: |-
            Indicates the model to use for the node's network interfaces.

            * `virtio` - VirtIO
            * `e1000` - Intel E1000
        cpu_mode:
          allOf:
          - $ref: '#/components/schemas/CpuModeEnum'
          default: custom
          description: |-
            Indicates the CPU mode of the node. Can only be set for entities without an `emulation_type` set.

            * `custom` - Custom CPU mode which can include custom CPU options.
            * `host-model` - CPU mode which attempts to select a CPU model resembling the hypervisor's CPU model as closely as possible.
            * `host-passthrough` - CPU mode which exposes all details of the hypervisor's CPU model.
        cpu_options:
          type: array
          items:
            $ref: '#/components/schemas/CpuOptionsEnum'
          description: Indicates the CPU options of the node. CPU mode must be set
            to `custom` for CPU options to be used. Can only be set for entities without
            an `emulation_type` set.
        secureboot:
          type: boolean
          default: false
          description: Indicates whether the node should perform a SecureBoot. UEFI
            must be enabled for SecureBoot to be used. Can only be set for entities
            without an `emulation_type` set.
        uefi:
          type: boolean
          default: false
          description: Indicates whether the node should use UEFI. Can only be set
            for entities without an `emulation_type` set.
        boot:
          allOf:
          - $ref: '#/components/schemas/BootEnum'
          default: hd
          description: |-
            Indicates how the node should boot.

            * `hd` - Disk boot
            * `network` - Network boot
    NodeAssignment:
