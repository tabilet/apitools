  /api/v3/histories/:
    get:
      operationId: api_v3_histories_list
      description: Get the history of the specified entity.
      summary: List history
      parameters:
      - in: query
        name: actor
        schema:
          type: string
      - in: query
        name: category
        schema:
          type: string
          enum:
          - ERROR
          - INFO
        description: |-
          The category of the history event.

          * `INFO` - info
          * `ERROR` - error
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: model
        schema:
          type: string
          title: Python model class name
          enum:
          - simulation
        description: |-
          The entity which you want to get history for.

          * `simulation` - Simulation
        required: true
      - in: query
        name: object_id
        schema:
          type: string
          format: uuid
        description: The ID of the entity which you want to get history for (for example,
          the simulation ID).
        required: true
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -actor
          - -category
          - -created
          - actor
          - category
          - created
        description: Order the response by the specified field.
      - in: query
        name: search
        schema:
          type: string
        description: Search for substrings in `actor`, `description`, or `category`.
      tags:
      - History
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedHistoryList'
          description: ''
  /api/v3/images/:
    get:
      operationId: api_v3_images_list
      description: |-
        **Required scope:** `air:image_read` (roles: `air_image_publisher`, `air_image_uploader`, `air_org_admin`, `air_user`)

        **Alternative:** role `air_trainee` also grants access.
      summary: List images visible to your account
      parameters:
      - in: query
        name: cpu_arch
        schema:
          type: string
          enum:
          - ARM
          - x86
        description: |-
          * `x86` - x86
          * `ARM` - ARM
      - in: query
        name: creator
        schema:
          type: string
        description: The email of the client who created the image.
      - in: query
        name: hash
        schema:
          type: string
      - in: query
        name: includes_air_agent
        schema:
          type: boolean
      - in: query
        name: is_owned_by_client
        schema:
          type: boolean
        description: Whether the client's org owns the image.
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: name
        schema:
          type: string
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -cpu_arch
          - -created
          - -creator
          - -hash
          - -includes_air_agent
          - -is_owned_by_client
          - -last_uploaded_at
          - -modified
          - -name
          - -provider
          - -published
          - -size
          - -upload_status
          - -version
          - cpu_arch
          - created
          - creator
          - hash
          - includes_air_agent
          - is_owned_by_client
          - last_uploaded_at
          - modified
          - name
          - provider
          - published
          - size
          - upload_status
          - version
        description: Order images by field. Prefix with "-" for descending order.
      - in: query
        name: provider
        schema:
          type: string
          enum:
          - CONTAINER
          - VM
        description: |-
          * `VM` - VM
          * `CONTAINER` - CONTAINER
      - in: query
        name: published
        schema:
          type: boolean
      - in: query
        name: search
        schema:
          type: string
        description: Search images by `name` or `version`.
      - in: query
        name: upload_status
        schema:
          type: string
          enum:
          - COMPLETE
          - COPYING_FROM_IMAGE_SHARE
          - PUBLISHING
          - READY
          - UNPUBLISHING
          - UPLOADING
          - VALIDATING
        description: |-
          The upload status of the image file.

          * `READY` - Ready
          * `UPLOADING` - Uploading
          * `VALIDATING` - Validating
          * `COMPLETE` - Complete
          * `PUBLISHING` - Publishing
          * `UNPUBLISHING` - Unpublishing
          * `COPYING_FROM_IMAGE_SHARE` - Copying from image share
      - in: query
        name: version
        schema:
          type: string
      tags:
      - Images
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedImageReadUpdateList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
          description: ''
    post:
      operationId: api_v3_images_create
      description: |-
        Once the image has been created, the image will transition to the `READY` state and the actual image content will need to be uploaded. Use the `start-upload` endpoint to upload the image content.

        **Required scope:** `air:image_write` (roles: `air_image_publisher`, `air_image_uploader`)
      summary: Create a new image for your organization
      tags:
      - Images
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImageCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImageCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageReadUpdate'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
          description: ''
  /api/v3/images/{id}/:
    get:
      operationId: api_v3_images_retrieve
      description: |-
        **Required scope:** `air:image_read` (roles: `air_image_publisher`, `air_image_uploader`, `air_org_admin`, `air_user`)

        **Alternative:** role `air_trainee` also grants access.
      summary: Get the details of an image visible to your account
      parameters:
      - in: path
        name: id
        schema:
          type: string
