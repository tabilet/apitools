          - $ref: '#/components/schemas/CpuArchEnum'
          default: x86
          description: |-
            The CPU architecture of the image.

            * `x86` - x86
            * `ARM` - ARM
        default_username:
          type: string
          description: The default username for authenticating with the operating
            system.
          maxLength: 64
        default_password:
          type: string
          description: The default password for authenticating with the operating
            system.
          maxLength: 64
        emulation_type:
          type: array
          items:
            type: string
            minLength: 1
          description: The types of emulation the image supports.
        emulation_version:
          type: string
          description: The version of the emulation the image supports.
          maxLength: 64
        provider:
          allOf:
          - $ref: '#/components/schemas/ProviderEnum'
          default: VM
          description: |-
            The provider of the image.

            * `VM` - VM
            * `CONTAINER` - CONTAINER
        published:
          type: boolean
          readOnly: true
          description: Whether the image is published.
        upload_status:
          allOf:
          - $ref: '#/components/schemas/UploadStatusEnum'
          readOnly: true
          description: |-
            The upload status of the image file.

            * `READY` - Ready
            * `UPLOADING` - Uploading
            * `VALIDATING` - Validating
            * `COMPLETE` - Complete
            * `PUBLISHING` - Publishing
            * `UNPUBLISHING` - Unpublishing
            * `COPYING_FROM_IMAGE_SHARE` - Copying from image share
        last_uploaded_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: The date and time the image was last uploaded.
        size:
          type: integer
          readOnly: true
          description: The size of the image file in bytes.
        hash:
          type: string
          readOnly: true
          description: The hash of the image file. This is used to check if the content
            of the image has changed.
        is_owned_by_client:
          type: boolean
          description: If the image is owned by the client. When true, the client
            can share/publish/unpublish the image.
          readOnly: true
        notes:
          type: string
          description: Notes about the image.
          maxLength: 4096
        release_notes:
          type: string
          description: Release notes for the image.
          maxLength: 4096
        user_manual:
          type: string
          description: User manual for the image.
          maxLength: 4096
      required:
      - created
      - creator
      - default_password
      - default_username
      - hash
      - id
      - is_owned_by_client
      - last_uploaded_at
      - modified
      - name
      - published
      - size
      - upload_status
      - version
    ImageShare:
      type: object
      description: Serializer for image sharing.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: The primary key of the image share. This is the "claim code"
            which should be given to the target organization representative and be
            used as the `image_share` value when claiming an image share.
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
        image:
          type: string
          format: uuid
          description: The `id` of the image to share. This must be unpublished image
            owned by your organization.
        image_name:
          type: string
          readOnly: true
          description: The `name` of the image to share.
        image_version:
          type: string
          readOnly: true
          description: The `version` of the image to share.
        source_org_display_name:
          type: string
          description: The name of the organization sharing the image.
          readOnly: true
        target_org_display_name:
          type: string
          description: The name of the organization receiving the image.
          readOnly: true
        target_org:
          type: string
          description: The NGC org name of the organization receiving the image.
        expires_at:
          type: string
