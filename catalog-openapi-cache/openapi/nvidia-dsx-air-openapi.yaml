      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
        name:
          type: string
          maxLength: 128
        state:
          allOf:
          - $ref: '#/components/schemas/StateA21Enum'
          readOnly: true
        auto_oob_enabled:
          type: boolean
          readOnly: true
          nullable: true
          description: If OOB should be automatically configured.
        enable_dhcp:
          type: boolean
          readOnly: true
          nullable: true
          description: If DHCP should be enabled on the oob-mgmt-server for simulations
            with automatic OOB enabled.
        auto_netq_enabled:
          type: boolean
          readOnly: true
          nullable: true
          description: If NetQ should be automatically configured.
        netq_username:
          type: string
          readOnly: true
          nullable: true
        netq_password:
          type: string
          readOnly: true
          nullable: true
        sleep_at:
          type: string
          format: date-time
          nullable: true
          description: When the simulation should be automatically put to sleep (stored).
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: When the simulation should be automatically deleted.
        creator:
          type: string
          description: The email of the user who created the simulation
          readOnly: true
        assigned_to:
          type: string
          nullable: true
          description: The email of the user who is assigned to the simulation during
            a Training event.
          readOnly: true
        documentation:
          type: string
          nullable: true
          description: A documentation markdown or a URL to documentation markdown.
        metadata:
          type: string
          nullable: true
          description: Custom metadata as a JSON string. This field does not affect
            the runtime of the simulation. It is provided for clients to store metadata
            about the simulation for their own purposes.
          maxLength: 1048576
        complete_checkpoint_count:
          type: integer
          description: The number of complete checkpoints in the simulation. When
            a sim has complete checkpoints, nodes/interfaces cannot be modified, created,
            or deleted.
          readOnly: true
    PatchedSimulationEnableAutoOOB:
      type: object
      description: Serializer for enabling automatic OOB on a simulation.
      properties:
        enable_dhcp:
          type: boolean
          default: true
          description: If DHCP should be enabled on the oob-mgmt-server.
    PatchedSimulationRebuild:
      type: object
      description: Serializer for validation when rebuilding a simulation.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        checkpoint:
          type: string
          format: uuid
          nullable: true
          description: A COMPLETE checkpoint to start the simulation from. If no checkpoint
            is provided the most recently created checkpoint for the simulation will
            be used.
    PatchedSimulationShutdown:
      type: object
      description: Serializer for validation when shutting down a simulation.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        create_checkpoint:
          type: boolean
          default: true
          description: If a new checkpoint should be created when shutting down the
            simulation. When true, the simulation will shut down and enter a temporary
            `SAVING` state while the checkpoint is getting saved; if necessary, Air
            may delete an existing checkpoint of your simulation to make room in storage
            for the newly created checkpoint. If false, the simulation will be purged
            from the workers and updates applied to the simulation from its current
            run will be lost; previously saved checkpoints will not be affected.
    PatchedSimulationStart:
      type: object
      description: |-
        Serializer for validation when starting a simulation.

        In the future, we may allow clients to start simulations from specific
        snapshots or from no snapshots.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        checkpoint:
          type: string
          format: uuid
          nullable: true
          description: A COMPLETE checkpoint to start the simulation from. If no checkpoint
            is provided the most recently created checkpoint for the simulation will
            be used.
    PatchedTrainingAddAttendees:
      type: object
      description: Payload for adding attendees to a training.
      properties:
        attendees:
          type: array
          items:
            type: string
            format: email
            description: The email address of the associated user. These are case-insensitive
              and duplicates are not permitted.
          description: List of attendee email addresses
    PatchedTrainingRemoveAttendees:
      type: object
      description: Payload for removing attendees from a training.
      properties:
        attendees:
          type: array
          items:
            type: string
            format: email
            description: The email address of the associated user. These are case-insensitive
              and duplicates are not permitted.
          description: List of attendee email addresses
    PatchedTrainingUpdate:
      type: object
      description: |-
        Serializer for updating Training instances.

        Only allows updating event timing fields. Parent simulation, checkpoint,
        and attendees cannot be modified after creation.
      properties:
        display_name:
          type: string
          description: The display name of the training event. This is a more human-readable
            display name for the training which does not need to match the name of
            the NGC external user group.
          maxLength: 128
        event_time:
          type: string
          format: date-time
          description: "The time at which the training event will occur. This value\
            \ must be at least 5h in the future. `sim_end_time` must be at least 24h\
            \ after this value. \n`sim_start_time` must be at least 4h before this\
            \ value."
        sim_start_time:
          type: string
          format: date-time
          description: This is the time at which simulation workbenches will be created
            for all `attendees` and the `instructor` of the training; these simulations
            will be started at this time given there is sufficient capacity. If updated,
            this value must be at least 1h in the future and 4h before `event_time`
        sim_end_time:
          type: string
          format: date-time
          description: This is the time at which simulation workbenches will expire
            for all `attendees` and the `instructor` of the training; the simulations
            will be destroyed at this time. This value must be at least 24h after
            `event_time`
    PatchedUCPAlert:
      type: object
      description: |-
        Read and partial-update serializer for `UsageAlert` rows.

        Only `recipients` is writable. Creation goes through `UCPAlertCreateSerializer`
        because `threshold` is fixed on UCP at registration time and cannot be
        patched on an existing alert.
      properties:
        alert_id:
          type: string
          format: uuid
          readOnly: true
          description: The UUID UCP assigned to the alert when it was registered.
        alert_type:
          allOf:
          - $ref: '#/components/schemas/AlertTypeEnum'
          readOnly: true
          description: |-
            The UCP webhook event this alert is registered for.

            * `USAGE_REMAINING_ALERT` - USAGE_REMAINING_ALERT
            * `USAGE_GRANT_THRESHOLD_REACHED` - USAGE_GRANT_THRESHOLD_REACHED
            * `USAGE_GRANT_EXHAUSTED` - USAGE_GRANT_EXHAUSTED
            * `CONTRACT_ENDED` - CONTRACT_ENDED
        threshold:
          type: integer
          readOnly: true
          description: Remaining balance in USD cents at which UCP will fire the webhook
            back to Air.
        recipients:
          type: array
          items:
            type: string
            format: email
          description: Email addresses notified when UCP fires the webhook. Providing
            a value on update **overwrites** the existing recipients rather than appending
            to them; to add a new recipient include the existing recipients in the
            request as well.
        last_fired:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When Air last dispatched an email for this alert, or null if
            it has never fired.
        creator:
          type: string
          readOnly: true
          description: Email of the client that registered this alert.
        org_display_name:
          type: string
          readOnly: true
          description: Display name of the organization this alert belongs to.
        ngc_org_name:
          type: string
          readOnly: true
          description: NGC org name of the organization this alert belongs to.
        org_nca_id:
          type: string
          readOnly: true
          description: NCA id of the organization this alert belongs to.
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
