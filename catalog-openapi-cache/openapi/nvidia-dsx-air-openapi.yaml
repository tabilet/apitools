      description: "Rebuild multiple nodes in a simulation at once. \n\nRebuilding\
        \ a node means returning the node to either the state of the current checkpoint\
        \ of its simulation or its initial, first boot state. When rebuilding from\
        \ the initial state, all repeatable instructions for selected nodes will be\
        \ applied. All existing instructions created for the selected nodes which\
        \ have not yet been completed  will be failed. All existing instructions created\
        \ for the selected nodes which have not yet been delivered will be cancelled.\
