  /api/v3/ucp/alerts/:
    get:
      operationId: api_v3_ucp_alerts_list
      description: |-
        List the usage threshold alerts registered for the authenticated user's organization. Each alert records a remaining-balance threshold (in USD cents) at which UCP will fire a webhook so Air can email the configured recipients. Air admins and SREs see alerts across all orgs. Results are searchable by `creator`, `org_display_name`, `ngc_org_name`, `org_nca_id`, and `threshold`, and orderable by `created`, `modified`, `last_fired`, or `threshold`.

        **Required role:** `air_org_admin`
      summary: List usage threshold alerts
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -created
          - -last_fired
          - -modified
          - -threshold
          - created
          - last_fired
          - modified
          - threshold
        description: Order objects by field. Prefix with `-` for descending order.
      - in: query
        name: search
        schema:
          type: string
        description: Search by `creator`, `org_display_name`, `ngc_org_name`, `org_nca_id`,
          or `threshold`.
      tags:
      - UCP
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUCPAlertList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
          description: ''
    post:
      operationId: api_v3_ucp_alerts_create
      description: |-
        Register a new usage threshold alert. Air calls UCP to register the alert, persists the returned alert id with the supplied recipients, and returns the full serialized instance. `threshold` is the org's remaining balance in USD cents at which UCP will fire the webhook; it must be at least `1` (a threshold of `0` is reserved for the balance-exhaustion shutdown flow). `recipients` must contain at least one valid email address; if the creator wants to be notified when the alert fires they must include their own email address in this list. If Air fails to persist the alert after UCP registration, the UCP alert is deleted compensatingly before the request surfaces an error.

        **Required role:** `air_org_admin`
      summary: Register a new usage threshold alert
      tags:
      - UCP
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UCPAlertCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UCPAlertCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UCPAlertCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UCPAlert'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
          description: ''
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: ''
  /api/v3/ucp/alerts/{alert_id}/:
    get:
      operationId: api_v3_ucp_alerts_retrieve
      description: |-
        Retrieve a single usage threshold alert by its UCP `alert_id`. Scoped to the authenticated org; Air admins and SREs may retrieve alerts belonging to any org.

        **Required role:** `air_org_admin`
      summary: Retrieve a usage threshold alert
      parameters:
      - in: path
        name: alert_id
        schema:
          type: string
          format: uuid
          description: The UUID UCP assigned to the alert when it was registered.
        required: true
      tags:
      - UCP
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UCPAlert'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
          description: ''
    patch:
      operationId: api_v3_ucp_alerts_partial_update
      description: |-
        Update the recipients list of an existing usage threshold alert. Only `recipients` may be modified; `threshold` is fixed at registration time because it is stored on UCP itself and changing it would require tearing down and recreating the alert. To change the threshold, delete and recreate the alert. Providing a `recipients` value **overwrites** the existing list rather than appending to it; to add a new recipient include the existing recipients in the request as well. If the creator wants to be notified when the alert fires they must include their own email address in this list.

        **Required role:** `air_org_admin`
      summary: Update a usage threshold alert
      parameters:
      - in: path
        name: alert_id
        schema:
          type: string
          format: uuid
          description: The UUID UCP assigned to the alert when it was registered.
        required: true
      tags:
      - UCP
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUCPAlert'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUCPAlert'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUCPAlert'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UCPAlert'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
          description: ''
    delete:
      operationId: api_v3_ucp_alerts_destroy
      description: |-
        Delete a usage threshold alert. Air calls UCP to deregister the alert and removes the Air-side row. If UCP has already forgotten the alert (404) the deletion still succeeds locally.

        **Required role:** `air_org_admin`
      summary: Delete a usage threshold alert
      parameters:
      - in: path
        name: alert_id
        schema:
          type: string
          format: uuid
          description: The UUID UCP assigned to the alert when it was registered.
        required: true
      tags:
      - UCP
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
          description: ''
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: ''
