      operationId: api_v3_simulations_nodes_list
      description: |-
        List nodes in a simulation.

        **Required scope:** `air:simulation_read` (roles: `air_org_admin`, `air_user`)

        **Alternative:** role `air_trainee` also grants access.
      summary: List nodes
      parameters:
      - in: query
        name: category
        schema:
          type: string
          enum:
          - ''
          - NETQ_TS
          - OOB_SERVER
          - OOB_SWITCH
          - SERVER
          - SWITCH
        description: |-
          The Air specific category the node belongs to.

          * `` - None
          * `SERVER` - Server
          * `SWITCH` - Switch
          * `OOB_SERVER` - OOB Management Server
          * `OOB_SWITCH` - OOB Management Switch
          * `NETQ_TS` - NetQ Telemetry
      - in: query
        name: image
        schema:
          type: string
          format: uuid
        description: Lookup all nodes for a specific `image`.
      - in: query
        name: labels__group
        schema:
          type: string
        description: Filter by the `group` label.
      - in: query
        name: labels__model
        schema:
          type: string
        description: Filter by the `model` label.
      - in: query
        name: labels__sku
        schema:
          type: string
        description: Filter by the `sku` label.
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: name
        schema:
          type: string
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -category
          - -cpu
          - -created
          - -image
          - -memory
          - -modified
          - -name
          - -simulation
          - -state
          - -storage
          - category
          - cpu
          - created
          - image
          - memory
          - modified
          - name
          - simulation
          - state
          - storage
        description: Order nodes by field. Prefix with "-" for descending order.
      - in: query
        name: search
        schema:
          type: string
        description: Search nodes by `name`, image `name`, or `category`.
      - in: query
        name: simulation
        schema:
          type: string
          format: uuid
        description: Lookup all nodes for a specific `simulation`
      - in: query
        name: state
        schema:
          type: string
          enum:
          - ACTIVE
          - BOOTING
          - ERROR
          - INACTIVE
          - REBUILDING
          - SHUTTING_DOWN
        description: |-
          The state of the node w.r.t. the simulation life cycle.

          * `INACTIVE` - Inactive
          * `BOOTING` - Booting
          * `ACTIVE` - Active
          * `SHUTTING_DOWN` - Shutting down
          * `ERROR` - Error
          * `REBUILDING` - Rebuilding
      - in: query
        name: status_from_worker
        schema:
          type: string
      tags:
      - Nodes
      responses:
        '200':
          content:
            application/json:
              schema:
