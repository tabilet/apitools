    NodeCreate:
      type: object
      description: Serializer for creating a new node.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
        name:
          type: string
          description: The hostname of the node; this must be unique.
        simulation:
          type: string
          format: uuid
          description: The simulation to add the node to.
        image:
          type: string
          format: uuid
          description: The image representing the operating system of the node.
        category:
          readOnly: true
          description: |-
            The Air specific category the node belongs to.

            * `` - None
            * `SERVER` - Server
            * `SWITCH` - Switch
            * `OOB_SERVER` - OOB Management Server
            * `OOB_SWITCH` - OOB Management Switch
            * `NETQ_TS` - NetQ Telemetry
          oneOf:
          - $ref: '#/components/schemas/Category1d0Enum'
          - $ref: '#/components/schemas/BlankEnum'
        state:
          allOf:
          - $ref: '#/components/schemas/State2bbEnum'
          readOnly: true
          description: |-
            The state of the node w.r.t. the simulation life cycle.

            * `INACTIVE` - Inactive
            * `BOOTING` - Booting
            * `ACTIVE` - Active
            * `SHUTTING_DOWN` - Shutting down
            * `ERROR` - Error
            * `REBUILDING` - Rebuilding
        status_from_worker:
          type: string
          readOnly: true
          description: The last known status of the node reported by the worker. This
            is the libvirt status of the VM/container.
        split_options:
          readOnly: true
          nullable: true
          description: A list of possible split options for interfaces for this node
        cpu:
          type: integer
          minimum: 1
          description: Number of CPU cores.
        memory:
          type: integer
          minimum: 1024
          description: RAM, in MiB.
        storage:
          type: integer
          minimum: 10
          description: Disk space, in GiB.
        pos_x:
          type: integer
          description: The horizontal coordinate position in the UI.
        pos_y:
          type: integer
          description: The vertical coordinate position in the UI.
        labels:
          allOf:
          - $ref: '#/components/schemas/NodeAttributes'
          description: 'Labels which can be specified on the node. Fields not specified
            in the payload schema will be completely ignored. If updating, the data
            provided will completely replace existing labels: attempting to PATCH
            specific labels will delete the other labels.'
        metadata:
          type: string
          nullable: true
          description: Custom metadata as a JSON string. This field does not affect
            the runtime of the node or simulation. It is provided for clients to store
            metadata about the node for their own purposes.
          maxLength: 1048576
        advanced:
          allOf:
          - $ref: '#/components/schemas/NodeAdvancedField'
          description: Advanced configuration associated with the node.
        cloud_init:
          allOf:
          - $ref: '#/components/schemas/CloudInitAssignment'
          readOnly: true
          description: Cloud-Init assignment for this node, if any.
        cdrom:
          allOf:
          - $ref: '#/components/schemas/CDROMAssignment'
          readOnly: true
          nullable: true
          description: CD-ROM assignment for this node, if any.
        storage_pci:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/TopologyFormatStoragePCIField'
          nullable: true
          description: Storage PCI elements associated with the node.
        management_mac:
          type: string
          description: The MAC address of the management interface.
        management_ip:
          type: string
          format: ipv4
          description: The IPv4 address of the management interface.
      required:
      - category
      - cdrom
      - cloud_init
      - created
      - id
      - image
      - modified
      - name
      - simulation
      - split_options
      - state
      - status_from_worker
