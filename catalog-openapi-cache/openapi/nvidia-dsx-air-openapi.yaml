          type: string
          description: Address of this PCI entity, in BDF notation (e.g 0000:1a:00.0).
          pattern: ^[0-9a-fA-F]{4}:[0-9a-fA-F]{2}:[0-9a-fA-F]{2}\.[0-7]{1}$
        port_type:
          type: string
          description: Type of port emulated by this device.
          minLength: 1
        number_of_ports:
          type: integer
          minimum: 1
          description: The explicit amount of ports that is requested to be set for
            the model
        os:
          type: string
          description: Name / UUID of a image to use as a disk for the entity.
          minLength: 1
        cpu:
          type: integer
          minimum: 1
          description: When `os` is set, amount of CPU cores to dedicate to the entity.
        memory:
          type: integer
          minimum: 1
          description: When `os` is set, amount of memory (in MiB) to dedicate to
            the entity.
        storage:
          type: integer
          minimum: 1
          description: When `os` is set, amount of disk space (in GB) to dedicate
            to the entity.
        positioning:
          allOf:
          - $ref: '#/components/schemas/TopologyFormatCoordinates'
          description: When `os` is set, entity positioning as seen in the UI.
        cpu_arch:
          allOf:
          - $ref: '#/components/schemas/CpuArchEnum'
          description: |-
            When `os` is set, desired CPU architecture of emulated hardware.

            * `x86` - x86
            * `ARM` - ARM
        simulator_image:
          type: string
          description: When `os` is set, explicit name / UUID of an image to use as
            a simulator image.
          minLength: 1
        management_mac:
          type: string
          description: When `os` is set and OOB is enabled, MAC address for the management
            interface (eth0).
        management_ip:
          type: string
          format: ipv4
          description: When `os` is set and OOB is enabled, IP address for the management
            interface on the OOB network. Must be within 192.168.0.0/16 and not end
            in .255 (broadcast).
      required:
      - emulation_type
    TopologyFormatNode:
      type: object
      description: A single node within the simulation. Accepts specified as well
        as arbitrary keys.
      properties:
        cpu:
          type: integer
          minimum: 1
          description: Amount of CPU cores to dedicate to the node.
        memory:
          type: integer
          minimum: 1
          description: Amount of memory (in MiB) to dedicate to the node.
        storage:
          type: integer
          minimum: 1
          description: Amount of disk space (in GB) to dedicate to the node.
        positioning:
          allOf:
          - $ref: '#/components/schemas/TopologyFormatCoordinates'
          description: Node positioning as seen in the UI.
        nic_model:
          allOf:
          - $ref: '#/components/schemas/NicModelEnum'
          default: virtio
          description: |-
            Indicates the model to use for the node's network interfaces.

            * `virtio` - VirtIO
            * `e1000` - Intel E1000
        cpu_mode:
          allOf:
          - $ref: '#/components/schemas/CpuModeEnum'
          default: custom
          description: |-
            Indicates the CPU mode of the node. Can only be set for entities without an `emulation_type` set.

            * `custom` - Custom CPU mode which can include custom CPU options.
            * `host-model` - CPU mode which attempts to select a CPU model resembling the hypervisor's CPU model as closely as possible.
            * `host-passthrough` - CPU mode which exposes all details of the hypervisor's CPU model.
        cpu_options:
          type: array
          items:
            $ref: '#/components/schemas/CpuOptionsEnum'
          description: Indicates the CPU options of the node. CPU mode must be set
            to `custom` for CPU options to be used. Can only be set for entities without
            an `emulation_type` set.
        secureboot:
          type: boolean
          default: false
          description: Indicates whether the node should perform a SecureBoot. UEFI
            must be enabled for SecureBoot to be used. Can only be set for entities
            without an `emulation_type` set.
        os:
          type: string
          description: Name / UUID of an image to use as a disk.
          minLength: 1
        cdrom:
          type: string
          description: Name / UUID of an image to put in the node's CD ROM.
          minLength: 1
        labels:
          allOf:
          - $ref: '#/components/schemas/TopologyFormatNodeAttributes'
          nullable: true
          description: Labels (attributes) of the node.
        management_mac:
          type: string
          description: MAC address to assign to the management interface of the node.
        management_ip:
          type: string
          format: ipv4
          description: IP address for the management interface on the OOB network.
            Must be within 192.168.0.0/16 and not end in .255 (broadcast). Using .254
            requires defining a custom gateway in oob.subnets. If not provided, IP
            is auto-assigned via DHCP when OOB is enabled. When OOB is disabled, this
            value is stored for documentation purposes.
        oob:
          type: boolean
          default: false
          description: Whether this node is part of a custom management network. Nodes
            which have this field set to `true` will boot before the rest. In order
            to set this flag, default Out-of-Band management network must be disabled.
        storage_pci:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/TopologyFormatStoragePCIField'
          nullable: true
          description: Storage PCI entities which are connected to this node.
        emulation_type:
          type: string
          nullable: true
          description: Hardware emulation type for this node.
          minLength: 1
        model:
          type: string
          description: When setting `emulation_type`, the hardware model that is being
            emulated.
          minLength: 1
        simulator_image:
          type: string
          description: When setting `emulation_type`, explicit name / UUID of an image
            to use as a simulator image.
          minLength: 1
        port_type:
          type: string
          description: When setting `emulation_type`, the type of port that is being
            emulated.
          minLength: 1
        number_of_ports:
          type: integer
          minimum: 1
          description: When setting `emulation_type`, the explicit amount of ports
            that is requested to be set for the model.
        network_pci:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/TopologyFormatNetworkPCIEntity'
          description: When setting `emulation_type`, network PCI entities which are
            connected to this node.
        pxehost:
          type: boolean
          default: false
          description: Whether to perform a PXE (network) boot.
        features:
          allOf:
          - $ref: '#/components/schemas/LegacyTopologyFormatNodeFeatures'
          description: Legacy field for fields which are now in `advanced` field.
      required:
      - os
    TopologyFormatNodeAttributes:
      type: object
      description: Node labels exposed in the API, stored internally as `attributes`.
      properties:
        group:
          type: string
          description: The group of the node.
          maxLength: 64
        model:
          type: string
          description: The model of the node.
          maxLength: 64
        sku:
          type: string
          description: The SKU of the node.
          maxLength: 64
        rack_name:
          type: string
          description: The name of the rack the node is part of.
        rack_unit:
          type: integer
          minimum: 0
          description: The unit number within a rack for the node.
        scalable_unit:
          type: integer
          minimum: 1
          description: The scalable unit number that the node belongs to.
        rail_index:
          type: integer
          minimum: 1
          description: The rail index that the node belongs to.
        data_hall:
          type: string
          description: The name of the data hall that the node is part of.
        tray_index:
          type: integer
          minimum: 0
          description: The tray index of the node.
        role:
          type: string
          description: The role of the node, e.g. leaf.
        pod:
          type: integer
          minimum: 0
          description: The pod number that the node belongs to.
        superspine_group:
          type: integer
          minimum: 0
          description: The superspine group number that the node belongs to.
        plane_id:
          type: integer
          maximum: 255
          minimum: 0
          description: Plane identifier in a multi-plane fabric.
    TopologyFormatOOBField:
      type: object
      description: Configuration of default Out-of-Band management network.
      properties:
        nodes:
          allOf:
          - $ref: '#/components/schemas/TopologyFormatOOBNodesField'
          description: Configuration of individual Out-of-Band management nodes.
        enable_dhcp:
          type: boolean
          default: true
          description: If the default DHCP service on the automatic Out-of-Band management
            network should be enabled.
        subnets:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/TopologyFormatOOBSubnetConfig'
          description: 'Custom gateway IP configurations for specific subnets. If
            not provided, default .254 addresses are used for all subnets. Example:
            {"192.168.200.0/24": {"gateway_ip": "192.168.200.1"}}'
    TopologyFormatOOBNode:
      type: object
      description: Configuration for an Out-of-Band node.
      properties:
        cpu:
          type: integer
          minimum: 1
          description: Amount of CPU cores to dedicate to the node.
        memory:
          type: integer
          minimum: 1
          description: Amount of memory (in MiB) to dedicate to the node.
        storage:
          type: integer
          minimum: 1
          description: Amount of disk space (in GB) to dedicate to the node.
        positioning:
          allOf:
          - $ref: '#/components/schemas/TopologyFormatCoordinates'
          description: Node positioning as seen in the UI.
    TopologyFormatOOBNodesField:
      type: object
      properties:
        oob-mgmt-server:
          $ref: '#/components/schemas/TopologyFormatOOBNode'
        oob-mgmt-switch:
          $ref: '#/components/schemas/TopologyFormatOOBNode'
    TopologyFormatOOBSubnetConfig:
      type: object
      description: Configuration for a custom gateway IP on a specific subnet.
      properties:
        gateway_ip:
          type: string
          format: ipv4
          description: Custom gateway IP address for this subnet.
      required:
      - gateway_ip
    TopologyFormatStoragePCIField:
      type: object
      description: Serializer for the `StoragePCI` field.
      properties:
        name:
          type: string
          description: Name of the storage PCI device. If not provided, a default
            name will be assigned in the format `nvme-<index+1>`. The name must contain
            only letters, numbers, and hyphens and be less than 20 characters
          maxLength: 20
          minLength: 1
        type:
          allOf:
          - $ref: '#/components/schemas/TopologyFormatStoragePCIFieldTypeEnum'
          description: |-
            Type of the storage PCI device

            * `NVME` - NVMe SSD Drive
        size:
          type: integer
          minimum: 1
          description: Size of the storage PCI device in GB
      required:
      - size
      - type
    TopologyFormatStoragePCIFieldTypeEnum:
      enum:
      - NVME
      type: string
      description: '* `NVME` - NVMe SSD Drive'
    TopologyParser:
      type: object
      description: Serializer for parsing topology data between different formats.
      properties:
        source_format:
          allOf:
          - $ref: '#/components/schemas/SourceFormatEnum'
          description: |-
            Topology format to parse the topology from.

            * `DOT` - DOT (graphvis) format
        destination_format:
          allOf:
          - $ref: '#/components/schemas/DestinationFormatEnum'
          description: |-
            Topology format to parse the topology to.

            * `JSON` - JSON format
        topology_data:
          type: string
          description: Topology content which matches the format specified in `source_format`.
      required:
      - destination_format
      - source_format
      - topology_data
    TrainingCreate:
      type: object
      description: Data required for creating a new training event.
      properties:
        name:
          type: string
          description: The name of the training event. This will also be used as the
            name of the NGC external user group.
          pattern: ^[a-z0-9-]+$
        display_name:
          type: string
          description: The display name of the training event. This is a more human-readable
            display name for the training which does not need to match the name of
            the NGC external user group.
          maxLength: 128
        parent_simulation:
          type: string
          format: uuid
          writeOnly: true
          description: The simulation to clone when creating a dedicated training
            simulation. This simulation will transition to the `CLONING` state briefly
            prior to transitioning back to the `INACTIVE` state. After this cloning
            process is complete, this simulation will no longer be associated with
            the newly created training event. Instead, a dedicated `training_simulation`
            will be associated with the training event; it is this `training_simulation`
            that will later be cloned for each attendee of the training session.
        parent_simulation_checkpoint:
          type: string
          format: uuid
          writeOnly: true
          description: A `COMPLETE` checkpoint which belongs to the `parent_simulation`
            which will be cloned onto the `training_simulation`.
        attendees:
          type: array
          items:
            type: string
            format: email
            description: The email address of the associated user. These are case-insensitive
              and duplicates are not permitted.
          description: List of attendee email addresses
        event_time:
          type: string
          format: date-time
          description: "The time at which the training event will occur. This value\
            \ must be at least 5h in the future. `sim_end_time` must be at least 24h\
            \ after this value. \n`sim_start_time` must be at least 4h before this\
            \ value."
        sim_start_time:
          type: string
          format: date-time
          description: This is the time at which simulation workbenches will be created
            for all `attendees` and the `instructor` of the training. These simulations
            will be started at this time given there is sufficient capacity. This
            value must be at least 1h in the future and 4h before `event_time`.
        sim_end_time:
          type: string
          format: date-time
          description: This is the time at which simulation workbenches will expire
            for all `attendees` and the `instructor` of the training; the simulations
            will be destroyed at this time. This value must be at least 24h after
            `event_time`
      required:
      - attendees
      - event_time
      - name
      - parent_simulation
      - sim_end_time
      - sim_start_time
    TrainingNGCData:
      type: object
      description: |-
        Serializer for external user group data from the get endpoint.

        This serializer deserializes the response from
        get_external_user_group, which includes full details about the group
        including confirmed users and pending invitations.
      properties:
        userGroupId:
          type: string
          description: Unique identifier for the NGC external user group.
        orgName:
          type: string
          description: NGC organization name.
        resourceGroup:
          type: string
          description: Resource group name.
        name:
          type: string
          description: Name of the external user group.
        description:
          type: string
          description: Description of the user group.
        idpListLocked:
          type: boolean
          description: Whether the identity provider list is locked.
        requireMatchingEmail:
          type: boolean
          description: Whether matching email is required.
        isUserGroupAdmin:
          type: boolean
          description: Whether the requester is a user group admin.
        serviceRoles:
          type: array
          items:
            type: string
          description: List of service roles for the group.
        companyName:
          type: string
          description: Company name.
        groupContactEmail:
          type: string
          description: Contact email for the group.
        permissionSetDesc:
          type: string
          description: Description of the permission set.
        startDate:
          type: string
          description: Start date of the user group.
        endDate:
          type: string
          description: End date of the user group.
        confirmedUsers:
          type: array
          items:
            $ref: '#/components/schemas/ConfirmedUserData'
          description: List of confirmed users in the group.
        pendingInvitations:
          type: array
          items:
            $ref: '#/components/schemas/PendingInvitationData'
          description: List of pending invitations.
        type:
          type: string
          description: Type of the user group.
      required:
      - confirmedUsers
      - description
      - idpListLocked
      - isUserGroupAdmin
      - name
      - pendingInvitations
      - requireMatchingEmail
      - resourceGroup
      - serviceRoles
      - type
      - userGroupId
    TrainingRead:
      type: object
      description: Basic information about a training event.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
        creator:
          type: string
          readOnly: true
          description: The email of the client that created the training.
        org:
          type: string
          format: uuid
          description: The organization associated with this training
        training_simulation:
          type: string
          format: uuid
          description: The template simulation used to create new simulations for
            the attendees of the training.
        training_simulation_name:
          type: string
          readOnly: true
          description: The name of the training simulation.
        training_simulation_state:
          type: string
          readOnly: true
          description: The state of the training simulation.
        checkpoint_name:
          type: string
          nullable: true
          description: The name of the checkpoint used to create the training simulation.
          readOnly: true
        parent_simulation_name:
          type: string
          nullable: true
          description: The name of the parent simulation that was cloned to create
            the training simulation. This value is captured at clone time and does
            not change if the original simulation is later renamed.
          readOnly: true
        event_time:
          type: string
          format: date-time
          description: When the training event will occur.
        name:
          type: string
          description: The name of the training event. This will also be the name
            of the NGC external user group, and thus must be kebab-case.
          maxLength: 255
        display_name:
          type: string
          readOnly: true
          description: The display name of the training event. This is a more human-readable
            display name for the training which does not need to match the name of
            the NGC external user group.
          maxLength: 128
        ngc_group_id:
          type: string
          description: The NGC external user group ID associated with this training.
          maxLength: 255
        attendees:
          description: List of validated attendee email addresses
        sim_start_time:
          type: string
          format: date-time
          description: When Air should start all attendee simulations for the training.
        sim_end_time:
          type: string
          format: date-time
          description: When Air should stop and destroy all attendee simulations of
            the training.
        workbenches_created:
          type: boolean
          description: Whether the workbenches have been created for this training.
      required:
      - checkpoint_name
      - created
      - creator
      - display_name
      - event_time
      - id
      - modified
      - name
      - ngc_group_id
      - org
      - parent_simulation_name
      - sim_end_time
      - sim_start_time
      - training_simulation
      - training_simulation_name
      - training_simulation_state
    UCPAlert:
      type: object
      description: |-
        Read and partial-update serializer for `UsageAlert` rows.

        Only `recipients` is writable. Creation goes through `UCPAlertCreateSerializer`
        because `threshold` is fixed on UCP at registration time and cannot be
        patched on an existing alert.
      properties:
        alert_id:
          type: string
          format: uuid
          readOnly: true
          description: The UUID UCP assigned to the alert when it was registered.
        alert_type:
          allOf:
          - $ref: '#/components/schemas/AlertTypeEnum'
          readOnly: true
          description: |-
            The UCP webhook event this alert is registered for.

            * `USAGE_REMAINING_ALERT` - USAGE_REMAINING_ALERT
            * `USAGE_GRANT_THRESHOLD_REACHED` - USAGE_GRANT_THRESHOLD_REACHED
            * `USAGE_GRANT_EXHAUSTED` - USAGE_GRANT_EXHAUSTED
            * `CONTRACT_ENDED` - CONTRACT_ENDED
        threshold:
          type: integer
          readOnly: true
          description: Remaining balance in USD cents at which UCP will fire the webhook
            back to Air.
        recipients:
          type: array
          items:
            type: string
            format: email
          description: Email addresses notified when UCP fires the webhook. Providing
            a value on update **overwrites** the existing recipients rather than appending
            to them; to add a new recipient include the existing recipients in the
            request as well.
        last_fired:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When Air last dispatched an email for this alert, or null if
            it has never fired.
        creator:
          type: string
          readOnly: true
          description: Email of the client that registered this alert.
        org_display_name:
          type: string
          readOnly: true
          description: Display name of the organization this alert belongs to.
        ngc_org_name:
          type: string
          readOnly: true
          description: NGC org name of the organization this alert belongs to.
        org_nca_id:
          type: string
          readOnly: true
          description: NCA id of the organization this alert belongs to.
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
      required:
      - alert_id
      - alert_type
      - created
      - creator
      - last_fired
      - modified
      - ngc_org_name
      - org_display_name
      - org_nca_id
      - recipients
      - threshold
    UCPAlertCreate:
      type: object
      description: Validates the payload used to register a UCP usage threshold alert.
      properties:
        threshold:
          type: integer
          maximum: 2147483647
          minimum: 1
          description: Remaining balance (in USD cents) at which UCP will fire the
            webhook back to Air. Must be at least `1` (`0` is reserved for the balance-exhaustion
            shutdown flow) and at most `2147483647` (the largest 32-bit signed integer,
            matching the underlying `PositiveIntegerField` column).
        recipients:
          type: array
          items:
            type: string
            format: email
          description: Email addresses that should be notified when this alert is
            tripped. Must contain at least one valid email address.
      required:
      - recipients
      - threshold
    UIImage:
      type: object
      description: Used to get data on a specific image for the UI view.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: The `name` of the image. This must be unique with the `version`.
          maxLength: 128
          minLength: 1
        version:
          type: string
          description: The `version` of the image. This must be unique with the `name`.
          maxLength: 64
          minLength: 1
        created:
          type: string
          format: date-time
          readOnly: true
        creator:
          type: string
          nullable: true
          description: The email of the user who created the image.
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
        mountpoint:
          type: string
          nullable: true
          description: Partition that hosts the operating system root file system.
          minLength: 1
        minimum_resources:
          allOf:
          - $ref: '#/components/schemas/ImageMinimumResources'
          description: The minimum resources required to run the image.
        includes_air_agent:
          type: boolean
          default: false
          description: Whether the image includes the Air Agent service.
        cpu_arch:
          allOf:
          - $ref: '#/components/schemas/CpuArchEnum'
          default: x86
          description: |-
            The CPU architecture of the image.

            * `x86` - x86
            * `ARM` - ARM
        default_username:
          type: string
          description: The default username for authenticating with the operating
            system.
          maxLength: 64
        default_password:
          type: string
          description: The default password for authenticating with the operating
            system.
          maxLength: 64
        emulation_type:
          type: array
          items:
            type: string
            minLength: 1
          description: The types of emulation the image supports.
        emulation_version:
          type: string
          description: The version of the emulation the image supports.
          maxLength: 64
        provider:
          allOf:
          - $ref: '#/components/schemas/ProviderEnum'
          default: VM
          description: |-
            The provider of the image.

            * `VM` - VM
            * `CONTAINER` - CONTAINER
        published:
          type: boolean
          readOnly: true
          description: Whether the image is published.
        upload_status:
          allOf:
          - $ref: '#/components/schemas/UploadStatusEnum'
          readOnly: true
          description: |-
            The upload status of the image file.

            * `READY` - Ready
            * `UPLOADING` - Uploading
            * `VALIDATING` - Validating
            * `COMPLETE` - Complete
            * `PUBLISHING` - Publishing
            * `UNPUBLISHING` - Unpublishing
            * `COPYING_FROM_IMAGE_SHARE` - Copying from image share
        last_uploaded_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: The date and time the image was last uploaded.
        size:
          type: integer
          readOnly: true
          description: The size of the image file in bytes.
        hash:
          type: string
          readOnly: true
          description: The hash of the image file. This is used to check if the content
            of the image has changed.
        is_owned_by_client:
          type: boolean
          description: If the image is owned by the client. When true, the client
            can share/publish/unpublish the image.
          readOnly: true
        notes:
          type: string
          description: Notes about the image.
          maxLength: 4096
        release_notes:
          type: string
          description: Release notes for the image.
          maxLength: 4096
        user_manual:
          type: string
          description: User manual for the image.
          maxLength: 4096
        ngc_org_name:
          type: string
          readOnly: true
          description: The NGC org name of the org that owns the image.
      required:
      - created
      - creator
      - default_password
      - default_username
      - hash
      - id
      - is_owned_by_client
      - last_uploaded_at
      - modified
      - name
      - ngc_org_name
      - published
      - size
      - upload_status
      - version
    UILink:
      type: object
      description: Serializer for the UILinkViewSet.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 15
        node_id:
          type: string
          format: uuid
          readOnly: true
        node_name:
          type: string
          readOnly: true
          description: The name of the interface's node.
        connection_id:
          type: string
          format: uuid
          nullable: true
          description: A "link" between two interfaces.
          readOnly: true
        connection_name:
          type: string
          readOnly: true
          description: The connection's name.
        connection_node_id:
          type: string
          readOnly: true
          description: The id of the connection's node.
        connection_node_name:
          type: string
          readOnly: true
          description: The name of the connection's node.
      required:
      - connection_id
      - connection_name
      - connection_node_id
      - connection_node_name
      - id
      - name
      - node_id
      - node_name
    UINode:
      type: object
      description: Serializer for the UINodeViewSet.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
        simulation:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 255
        category:
          description: |-
            The Air specific category the node belongs to.

            * `` - None
            * `SERVER` - Server
            * `SWITCH` - Switch
            * `OOB_SERVER` - OOB Management Server
            * `OOB_SWITCH` - OOB Management Switch
            * `NETQ_TS` - NetQ Telemetry
          oneOf:
          - $ref: '#/components/schemas/Category1d0Enum'
          - $ref: '#/components/schemas/BlankEnum'
        image:
          type: string
          format: uuid
          description: The image representing the operating system of the node.
        image_name:
          type: string
          readOnly: true
          description: The name of the image.
        cpu:
          type: integer
          maximum: 2147483647
          minimum: 1
          description: Number of CPU cores.
        memory:
          type: integer
          maximum: 2147483647
          minimum: 1
          description: RAM, in MiB.
        storage:
          type: integer
          maximum: 2147483647
          minimum: 1
          description: Disk space, in GiB.
        state:
          description: |-
            The state of the node w.r.t. the simulation life cycle.

            * `INACTIVE` - Inactive
            * `BOOTING` - Booting
            * `ACTIVE` - Active
            * `SHUTTING_DOWN` - Shutting down
            * `ERROR` - Error
            * `REBUILDING` - Rebuilding
          oneOf:
          - $ref: '#/components/schemas/State2bbEnum'
          - $ref: '#/components/schemas/BlankEnum'
        status_from_worker:
          type: string
          description: The last known status of the node reported by the worker. This
            is the libvirt status of the VM/container.
          maxLength: 32
        labels:
          $ref: '#/components/schemas/NodeAttributes'
        console_username:
          type: string
          description: The username used when signing into a node using the Web UI
            console.
          maxLength: 8
        console_password:
          type: string
          description: The password used when signing into a node using the Web UI
            console as well as the VNC console.
          maxLength: 8
        serial_console_url:
          type: string
          nullable: true
          description: The URL of the node's serial console.
          readOnly: true
        vnc_console_url:
          type: string
          nullable: true
          description: The URL of the node's VNC console.
          readOnly: true
        worker_fqdn:
          type: string
          nullable: true
          description: FQDN of the worker that is hosting the node.
          readOnly: true
      required:
      - created
      - id
      - image
      - image_name
      - labels
      - modified
      - name
      - serial_console_url
      - simulation
      - vnc_console_url
      - worker_fqdn
    UISim:
      type: object
      description: Serializer for the UI's simulation list.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
        name:
          type: string
          maxLength: 128
        state:
          $ref: '#/components/schemas/StateA21Enum'
        auto_oob_enabled:
          type: boolean
          nullable: true
          description: If OOB should be automatically configured.
        enable_dhcp:
          type: boolean
          nullable: true
          description: If DHCP should be enabled on the oob-mgmt-server for simulations
            with automatic OOB enabled.
        auto_netq_enabled:
          type: boolean
          nullable: true
          description: If NetQ should be automatically configured.
        node_count:
          type: integer
          readOnly: true
          description: The number of nodes in the simulation.
        creator:
          type: string
          readOnly: true
          description: The email of the user who created the simulation
        complete_checkpoint_count:
          type: integer
          readOnly: true
          description: The number of complete checkpoints in the simulation. When
            a sim has complete checkpoints, nodes/interfaces cannot be modified, created,
            or deleted.
        ngc_org_name:
          type: string
          readOnly: true
          description: The NGC name of the org that owns the simulation; this is NOT
            the display name, it is a unique identifier number.
        sleep_at:
          type: string
          format: date-time
          nullable: true
          description: When the simulation should be automatically put to sleep (stored).
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: When the simulation should be automatically deleted.
        assigned_to:
          type: string
          readOnly: true
          description: The email of the user who is assigned to the simulation during
            a Training event.
        created_for_training:
          type: boolean
          readOnly: true
          description: Whether the simulation was created for a Training event.
        owner:
          type: string
          readOnly: true
          description: If the sim is associated with a training event, this is the
            assigned_to value; otherwise it is the creator.
      required:
      - assigned_to
      - complete_checkpoint_count
      - created
      - created_for_training
      - creator
      - id
      - modified
      - name
      - ngc_org_name
      - node_count
      - owner
    UISimRetrieve:
      type: object
