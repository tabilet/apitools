    UpdateNodeGraphData:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the node to update.
        pos_x:
          type: integer
          description: The horizontal coordinate position in the UI.
        pos_y:
          type: integer
          description: The vertical coordinate position in the UI.
        labels:
          allOf:
          - $ref: '#/components/schemas/NodeAttributes'
          description: 'Labels which can be specified on the node. Fields not specified
            in the payload schema will be completely ignored. If updating, the data
            provided will completely replace existing labels: attempting to PATCH
            specific labels will delete the other labels.'
      required:
      - id
    UploadStatusEnum:
      enum:
      - READY
      - UPLOADING
      - VALIDATING
      - COMPLETE
      - PUBLISHING
      - UNPUBLISHING
      - COPYING_FROM_IMAGE_SHARE
      type: string
      description: |-
        * `READY` - Ready
        * `UPLOADING` - Uploading
        * `VALIDATING` - Validating
        * `COMPLETE` - Complete
        * `PUBLISHING` - Publishing
        * `UNPUBLISHING` - Unpublishing
        * `COPYING_FROM_IMAGE_SHARE` - Copying from image share
    UserConfigBase:
      type: object
      description: Base payload for a user config.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Display name for a config.
          maxLength: 64
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          description: |-
            What kind of content does this config contain.

            * `cloud-init-user-data` - Cloud-Init User Data
            * `cloud-init-meta-data` - Cloud-Init Meta Data
        content:
          type: string
          description: Plain text contents of the config.
      required:
      - content
      - id
      - kind
      - name
    UserConfigList:
      type: object
      description: List structure of a user config. Does not include the `content`
        field of the config.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Display name for a config.
          maxLength: 64
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          description: |-
            What kind of content does this config contain.

            * `cloud-init-user-data` - Cloud-Init User Data
            * `cloud-init-meta-data` - Cloud-Init Meta Data
      required:
      - id
      - kind
      - name
    UserConfigUpdate:
      type: object
      description: Payload for updating a user config.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Display name for a config.
          maxLength: 64
        content:
          type: string
          description: Plain text contents of the config.
      required:
      - content
      - id
      - name
    UserOrgAssociation:
      type: object
      description: Observed association between a user and an org.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          type: string
          format: uuid
          description: The user observed to be associated with the org.
        org:
          type: string
          format: uuid
          description: The org the user was observed to be associated with.
        username:
          type: string
          readOnly: true
          description: The username of the associated user.
        email:
          type: string
          format: email
          readOnly: true
          description: The email of the associated user.
        is_service_account:
          type: boolean
          readOnly: true
          description: Whether the associated user is a service account.
        user_is_banned:
          type: boolean
          readOnly: true
          description: Whether the associated user is banned.
        sims_created_count:
          type: integer
          readOnly: true
          description: Number of simulations the user has created in this org.
        images_created_count:
          type: integer
          readOnly: true
          description: Number of images the user has created in this org.
        ngc_org_name:
          type: string
          readOnly: true
          description: The NGC Organization Name of the associated org.
        org_display_name:
          type: string
          readOnly: true
          description: The display name of the associated org.
        org_nca_id:
          type: string
          readOnly: true
          description: The NCA ID of the associated org.
        first_observed:
          type: string
          format: date-time
          description: When the user was first observed to be associated with the
            org.
        last_observed:
          type: string
          format: date-time
          description: When the user was last observed to be associated with the org.
        last_observed_scopes:
          description: The list of scopes the user had when they were last observed
            to be associated with the org.
        last_observed_roles:
          description: The list of roles the user had when they were last observed
            to be associated with the org.
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
      required:
      - created
      - email
      - id
      - images_created_count
      - is_service_account
      - last_observed
      - modified
      - ngc_org_name
      - org
      - org_display_name
      - org_nca_id
      - sims_created_count
      - user
      - user_is_banned
      - username
    VolumesEnum:
      enum:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /dev/mqueue:/dev/mqueue:rw
      type: string
      description: |-
        * `/sys/fs/cgroup:/sys/fs/cgroup:rw` - CGROUP (Read-Write)
        * `/dev/mqueue:/dev/mqueue:rw` - Message Queue (Read-Write)
    Worker:
      type: object
      description: Payload structure of CRUD operations on a worker.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
        fqdn:
          type: string
          maxLength: 255
        cpu:
          type: integer
          maximum: 2147483647
          minimum: 0
        memory:
          type: integer
          maximum: 2147483647
          minimum: 0
        storage:
          type: integer
          maximum: 2147483647
          minimum: 0
        available:
          type: boolean
        cpu_arch:
          $ref: '#/components/schemas/CpuArchEnum'
        ip_address:
          type: string
        fleet:
          type: string
          format: uuid
          description: The fleet that the worker belongs to.
        flags:
          allOf:
          - $ref: '#/components/schemas/WorkerFlags'
          description: Behavior flags for the worker.
      required:
      - created
      - fleet
      - fqdn
      - id
      - ip_address
      - modified
    WorkerBulkUpdateInstruction:
      type: object
      description: A serializer for parsing the payload of bulk update instruction
        requests.
      properties:
        state:
          allOf:
          - $ref: '#/components/schemas/State727Enum'
          description: |-
            The new state of the instructions specified in the `ids` field.

            * `READY` - The instruction is ready to be picked up and executed.
            * `IN_PROGRESS` - The instruction has been picked up by the worker.
            * `COMPLETE` - The instruction was successfully executed.
            * `FAILED` - The instruction failed to finish execution.
            * `CANCELLED` - The READY instruction was cancelled.
        ids:
          type: array
          items:
            type: string
            format: uuid
          description: The IDs of instructions to update.
      required:
      - ids
      - state
    WorkerCapacity:
      type: object
      description: |-
        Read-only serializer for worker capacity information.

        Provides a comprehensive view of worker resources including total capacity
        and currently available capacity. Used for admin capacity monitoring.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        fqdn:
          type: string
          readOnly: true
        fleet_name:
          type: string
          readOnly: true
          description: Name of the fleet the worker belongs to.
        cpu_arch:
          allOf:
          - $ref: '#/components/schemas/CpuArchEnum'
          readOnly: true
        alive:
          type: boolean
          readOnly: true
          description: Whether the worker is currently sending heartbeats.
        available:
          type: boolean
          readOnly: true
        node_count:
          type: integer
          readOnly: true
          description: Number of nodes assigned to the worker.
        total_resources:
          allOf:
          - $ref: '#/components/schemas/PackingResources'
          readOnly: true
          description: Total resource capacity of the worker.
        available_resources:
          allOf:
          - $ref: '#/components/schemas/PackingResources'
          readOnly: true
          description: Currently available resource capacity (total - in use).
      required:
      - alive
      - available
      - available_resources
      - cpu_arch
      - fleet_name
      - fqdn
      - id
      - node_count
      - total_resources
    WorkerClientCertificate:
      type: object
      description: Worker client certificate representation.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        worker:
          type: string
          format: uuid
          readOnly: true
          description: The worker that the client certificate is issued for.
        worker_fqdn:
          type: string
          readOnly: true
          description: FQDN of the worker that the client certificate is issued to.
        usable:
          type: boolean
          description: "Whether the client certificate can be used for authentication.\n\
            \        This means that the certificate is neither expired nor revoked.\n\
            \        "
          readOnly: true
        expires:
          type: string
          format: date-time
          readOnly: true
          description: The date and time when the client certificate expires.
        fingerprint:
          type: string
          description: SHA-256 fingerprint of the client certificate.
          readOnly: true
        last_used:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: The date and time when the client certificate was last used
            for authentication.
        revoked:
          type: boolean
          readOnly: true
          description: Whether the client certificate has been revoked.
      required:
      - expires
      - fingerprint
      - id
      - last_used
      - revoked
      - usable
      - worker
      - worker_fqdn
    WorkerCreation:
      type: object
      description: Response structure for worker creation request.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
        fqdn:
          type: string
          maxLength: 255
        cpu:
          type: integer
          readOnly: true
        memory:
          type: integer
          readOnly: true
        storage:
          type: integer
          readOnly: true
        available:
          type: boolean
          readOnly: true
        cpu_arch:
          $ref: '#/components/schemas/CpuArchEnum'
        ip_address:
          type: string
        fleet:
          type: string
          format: uuid
          description: The fleet that the worker belongs to.
        flags:
          allOf:
          - $ref: '#/components/schemas/WorkerFlags'
          description: Behavior flags for the worker.
        registration_token:
          type: string
          description: Token to be used during worker registration. Token is valid
            for 1 day, 0:00:00.
          readOnly: true
      required:
      - available
      - cpu
      - created
      - fleet
      - fqdn
      - id
      - ip_address
      - memory
      - modified
      - registration_token
      - storage
    WorkerFlags:
      type: object
      description: Serializer for parsing payload of worker flags.
      properties:
        task_handling:
          type: boolean
          description: Whether the worker should handle tasks.
      required:
      - task_handling
    WorkerInstruction:
      type: object
      description: Serializer for reading instructions by workers.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: The name of the instruction.
          maxLength: 256
        node:
          type: string
          format: uuid
          description: The node which will execute the instruction.
        data:
          type: string
          description: Instruction data encrypted for the specific node.
          readOnly: true
        state:
          oneOf:
          - $ref: '#/components/schemas/State727Enum'
          - $ref: '#/components/schemas/BlankEnum'
      required:
      - data
      - id
      - node
    WorkerNodeListBulkUpdate:
      type: object
      description: |-
        Serializer for reading and bulk updating nodes by workers.

        Returns minimal data to the worker since the worker only needs to know
        what nodes are assigned to it for status updates and orphaned node cleanup.
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the node.
        status_from_worker:
          type: string
          writeOnly: true
          description: The libvirt status of the node.
      required:
      - id
      - status_from_worker
    WorkerNodeRetrieve:
      type: object
      description: |-
        Serializer for getting a specific node of a worker.
        Used by Airstrike to configure an Airstrike container which tunnels
        web console connections to the node.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        serial_console_port:
          type: integer
          readOnly: true
          nullable: true
          description: Port that exposes the node's serial console.
        simulation:
          type: string
          format: uuid
          readOnly: true
        console_username:
          type: string
          readOnly: true
          description: The username used when signing into a node using the Web UI
            console.
        console_password:
          type: string
          readOnly: true
          description: The password used when signing into a node using the Web UI
            console as well as the VNC console.
        worker_ip:
          type: string
          readOnly: true
          description: IP address of the worker that the node is assigned to.
        emulated:
          type: boolean
          description: Whether the node is emulated by a custom simulator.
          readOnly: true
      required:
      - console_password
      - console_username
      - emulated
      - id
      - name
      - serial_console_port
      - simulation
      - worker_ip
    WorkerUserConfig:
      type: object
      description: Response payload for user configs assigned to the nodes hosted
        on the worker.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        content:
          type: string
          description: Plain text contents of the config.
      required:
      - content
      - id
    ZTPScriptViewSet:
      type: object
      description: Serializer for ZTPScriptViewSet.
      properties:
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
        content:
          type: string
          description: The content of the ZTP Script.
      required:
      - content
      - created
      - modified
