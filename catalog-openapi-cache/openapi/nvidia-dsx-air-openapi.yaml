          nullable: true
          readOnly: true
          description: Total disk storage (GB) the org may concurrently use, determined
            by SKUs. `None` indicates an unlimited concurrent disk storage limit.
        disk_storage_per_node_limit:
          type: integer
          readOnly: true
          description: Disk storage limit per node (GB).
        image_storage_limit:
          type: integer
          readOnly: true
          description: Image storage limit (GB).
        userconfig_content_limit:
          type: integer
          readOnly: true
          description: Userconfig content limit (bytes).
        cpu_used:
          type: number
          format: double
          readOnly: true
          description: CPU cores currently in use across all simulations.
        memory_used:
          type: number
          format: double
          readOnly: true
          description: Memory (MiB) currently in use across all simulations.
        disk_storage_used:
          type: number
          format: double
          readOnly: true
          description: Disk storage (GB) currently in use across all simulations.
        image_storage_used:
          type: number
          format: double
          readOnly: true
          description: Image storage currently in use (GB).
        userconfig_content_used:
          type: integer
          readOnly: true
          description: Userconfig content currently in use (bytes).
        has_paid_skus:
          type: boolean
          description: 'Whether the organization has any paid SKUs. Paid SKUs are:
            797-IAIRS1, 797-IAIRS2, 797-IAIRS3, 797-IAIRS4, 797-IAIRS5.'
          readOnly: true
        has_private_fleet:
          type: boolean
          readOnly: true
          description: Whether the org has a private fleet.
      required:
      - cpu_limit
      - cpu_used
      - created
      - disk_storage_limit
      - disk_storage_per_node_limit
      - disk_storage_used
      - fleet_id
      - fleet_name
      - has_paid_skus
      - has_private_fleet
      - id
      - image_storage_limit
      - image_storage_used
      - memory_limit
      - memory_used
      - nca_id
      - ngc_org_name
      - resource_budget
      - userconfig_content_limit
      - userconfig_content_used
