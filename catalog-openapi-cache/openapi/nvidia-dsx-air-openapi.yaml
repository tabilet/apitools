components:
  schemas:
    APIError:
      type: object
      description: Base fields each 400/500 range HTTP response must include.
      properties:
        detail:
          type: string
          description: Description of an error.
        request_id:
          type: string
          nullable: true
          description: ID assigned to the request which encountered the error. Should
            be provided when opening a support case.
      required:
      - detail
      - request_id
    AlertTypeEnum:
      enum:
      - USAGE_REMAINING_ALERT
      - USAGE_GRANT_THRESHOLD_REACHED
      - USAGE_GRANT_EXHAUSTED
      - CONTRACT_ENDED
      type: string
      description: |-
        * `USAGE_REMAINING_ALERT` - USAGE_REMAINING_ALERT
        * `USAGE_GRANT_THRESHOLD_REACHED` - USAGE_GRANT_THRESHOLD_REACHED
        * `USAGE_GRANT_EXHAUSTED` - USAGE_GRANT_EXHAUSTED
        * `CONTRACT_ENDED` - CONTRACT_ENDED
    AllowedUser:
      type: object
      description: Serializer for AllowedUser model.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          description: The email of the allowed user. This will always be normalized
            to lowercase.
          maxLength: 255
        creator:
          type: string
          nullable: true
          description: The email of the user who created the allowed user.
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
      required:
      - created
      - creator
      - email
      - id
      - modified
    Announcements:
      type: object
      description: Serializer for announcements.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        severity:
          allOf:
          - $ref: '#/components/schemas/SeverityEnum'
          default: INFO
          description: |-
            The severity of the announcement

            * `INFO` - Info
            * `ALERT` - Alert
        message:
          type: string
          description: The message of the announcement
          maxLength: 512
        created:
          type: string
          format: date-time
          readOnly: true
        state:
          allOf:
          - $ref: '#/components/schemas/AnnouncementsStateEnum'
          description: "\n        The state of the announcement. \n        State was\
            \ added to allow `soft delete` of announcements.\n        By default,\
            \ announcements are active and you will only see active announcements.\n\
            \        \n\n* `ACTIVE` - Active\n* `INACTIVE` - Inactive"
      required:
      - created
      - id
      - message
    AnnouncementsStateEnum:
      enum:
      - ACTIVE
      - INACTIVE
      type: string
      description: |-
        * `ACTIVE` - Active
        * `INACTIVE` - Inactive
    BadRequest:
      type: object
      description: Structure of a 400 Bad Request response.
      properties:
        detail:
          type: string
          description: Description of an error.
        request_id:
          type: string
          nullable: true
          description: ID assigned to the request which encountered the error. Should
            be provided when opening a support case.
        type:
          allOf:
          - $ref: '#/components/schemas/BadRequestTypeEnum'
          description: |-
            Specific type of a 400 error.

            * `PROTECTED` - Instance may not be deleted as it is being referenced by other instances.
            * `VALIDATION` - Validation errors encountered during payload processing.
        protected_instances:
          type: array
          items:
            $ref: '#/components/schemas/ProtectedErrorInstance'
          description: Instances which bar the current instance from being deleted.
            Only defined when `type` is set to `PROTECTED`.
        validation_errors:
          anyOf:
          - type: object
            description: Validation errors.
          - type: array
            items:
              type: object
              description: Validation errors.
            description: List of validation errors.
          description: Validation errors encountered during payload processing. Only
            defined when `type` is set to `VALIDATION`.
      required:
      - detail
      - request_id
      - type
    BadRequestTypeEnum:
      enum:
      - PROTECTED
      - VALIDATION
      type: string
      description: |-
        * `PROTECTED` - Instance may not be deleted as it is being referenced by other instances.
        * `VALIDATION` - Validation errors encountered during payload processing.
    Balance:
      type: object
      description: Data summarizing the balance of a Metronome contract.
      properties:
        total:
          type: integer
          readOnly: true
        commit:
          type: integer
          readOnly: true
        credit:
          type: integer
          readOnly: true
        currency:
          type: string
          readOnly: true
      required:
      - commit
      - credit
      - currency
      - total
    BillingRecord:
      type: object
      description: Read-only representation of a billing record.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
        org_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: Org id of the billed organization.
        org_display_name:
          type: string
          description: Display name of the billed organization.
        org_nca_id:
          type: string
          description: NCA ID of the billed organization.
        ngc_org_name:
          type: string
          description: NGC organization name for billing.
        simulation_uuid:
          type: string
          format: uuid
          description: Simulation id.
        sim_name:
          type: string
          description: Simulation name.
          maxLength: 128
        sim_creator:
          type: string
          description: Creator of the sim.
          maxLength: 150
        sim_owner:
          type: string
          description: Owner of the sim. Same as the creator unless sim is assigned
            to someone else.
          maxLength: 150
        sim_cpu:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Total CPU allocated across all nodes while the sim was running.
        sim_memory:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Total memory (MiB) allocated across all nodes while the sim
            was running.
        sim_storage:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Total storage (GB) allocated across all nodes while the sim
            was running.
        sim_compute_hours_rate:
          type: number
          format: double
          description: Compute-hours rate applied while the sim was running.
        sim_compute_hours_consumed:
          type: number
          format: double
          nullable: true
          description: 'Compute hours for this run: full interval when stopped, or
            elapsed through now when the run is still active (billing_ended_at is
            null).'
        sim_compute_hours_consumed_for_period:
          type: number
          format: double
          description: Compute hours consumed during the overlap of the sim billing
            interval and the query param period.
        run_id:
          type: string
          format: uuid
          nullable: true
          description: Run id the billing record corresponds to. Null when the run
            cannot be resolved (e.g. simulation deleted).
        billing_started_at:
          type: string
          format: date-time
          description: When this billing period began and the associated org started
            to pay to run the simulation at the associated `sim_compute_hours_rate`.
        billing_ended_at:
          type: string
          format: date-time
          nullable: true
          description: When this billing period ended and the associated org stopped
            getting charge for the current run of this simulation.
        fleet_id:
          type: string
          format: uuid
          nullable: true
          description: Id of the fleet running the sim.
        fleet_name:
          type: string
          description: Name of the fleet running the sim.
          maxLength: 128
      required:
      - billing_started_at
      - created
      - id
      - modified
      - ngc_org_name
      - org_display_name
      - org_id
      - org_nca_id
      - sim_compute_hours_consumed
      - sim_compute_hours_consumed_for_period
      - sim_compute_hours_rate
      - sim_cpu
      - sim_memory
      - sim_storage
      - simulation_uuid
    BillingRecordSummary:
      type: object
      description: Billing summary for a period, with query echo and aggregate metrics.
      properties:
        query:
          type: object
          additionalProperties:
            type: string
          description: Echo of the query parameters used to filter billing records.
        summary:
          allOf:
          - $ref: '#/components/schemas/BillingRecordSummaryMetrics'
          description: Aggregated billing metrics for the filtered billing records.
      required:
      - query
      - summary
    BillingRecordSummaryMetrics:
      type: object
      description: Aggregate metrics for billing records in the response period window.
      properties:
        total_billing_records:
          type: integer
          description: Number of billing records matching the filters and period overlap.
        total_orgs:
          type: integer
          description: Count of distinct orgs (org_id) among these records. Will be
            0 or 1 for AIR_ORG_ADMINS as they can only see records from their own
            org.
        total_sims:
          type: integer
          description: Count of distinct simulations (simulation_uuid) among those
            records.
        total_compute_hours_for_period:
          type: number
          format: double
          description: Sum of sim_compute_hours_consumed_for_period over matching
            records.
      required:
      - total_billing_records
      - total_compute_hours_for_period
      - total_orgs
      - total_sims
    BlankEnum:
      enum:
      - ''
    BlockedDomain:
      type: object
      description: Serializer for BlockedDomain model.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        domain:
          type: string
          description: The domain of the blocked domain. This will always be normalized
            to lowercase.
          maxLength: 255
        creator:
          type: string
          nullable: true
          description: The email of the user who created the blocked domain.
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
      required:
      - created
      - creator
      - domain
      - id
      - modified
    BootEnum:
      enum:
      - hd
      - network
      type: string
      description: |-
        * `hd` - Disk boot
        * `network` - Network boot
    CDROMAssignment:
      type: object
      description: Assignment of a CD-ROM image to a node.
      properties:
        image:
          type: string
          format: uuid
          description: Image that is being inserted into the node's CD-ROM drive.
      required:
      - image
    CapAddEnum:
      enum:
      - NET_ADMIN
      - SYS_NICE
      - SYS_RESOURCE
      - IPC_OWNER
      - IPC_LOCK
      type: string
      description: |-
        * `NET_ADMIN` - Network administration
        * `SYS_NICE` - Control over process priorities
        * `SYS_RESOURCE` - Override resource limits (RLIMIT_*, disk quotas, reserved filesystem space)
        * `IPC_OWNER` - Bypass permission checks on System V IPC objects (message queues, semaphores, shared memory)
        * `IPC_LOCK` - Lock memory pages (mlock/mlockall) and allocate huge pages for shared memory
    Category1d0Enum:
      enum:
      - SERVER
      - SWITCH
      - OOB_SERVER
      - OOB_SWITCH
      - NETQ_TS
      type: string
      description: |-
        * `` - None
        * `SERVER` - Server
        * `SWITCH` - Switch
        * `OOB_SERVER` - OOB Management Server
        * `OOB_SWITCH` - OOB Management Switch
        * `NETQ_TS` - NetQ Telemetry
    Checkpoint:
      type: object
      description: Serializer for the `CheckpointViewSet`
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: A customizable name.
          maxLength: 128
        run:
          type: string
          format: uuid
          readOnly: true
          description: The run during which the checkpoint was created.
        state:
          allOf:
          - $ref: '#/components/schemas/CheckpointStateEnum'
          readOnly: true
          description: |-
            The current state of the checkpoint.

            * `PENDING` - Pending
            * `COMPLETE` - Complete
            * `DELETED` - Deleted
        favorite:
          type: boolean
          description: If the checkpoint should be favored over others when Air determines
            which checkpoints should be automatically deleted.
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
      required:
      - created
      - id
      - modified
      - run
      - state
    CheckpointStateEnum:
      enum:
      - PENDING
      - COMPLETE
      - DELETED
      type: string
      description: |-
        * `PENDING` - Pending
        * `COMPLETE` - Complete
        * `DELETED` - Deleted
    ClaimImageShare:
      type: object
      description: Data used to claim an image share.
      properties:
        image_share:
          type: string
          format: uuid
          description: The image share "claim code" -- which is just the `id` of the
            image share record that was created by the source organization.
        name:
          type: string
          description: The `name` of the image. This must be unique with the `version`.
          maxLength: 128
          minLength: 1
        version:
          type: string
          description: The `version` of the image. This must be unique with the `name`.
          maxLength: 64
          minLength: 1
      required:
      - image_share
    CloudInitAssignment:
      type: object
      description: |-
        Assignment of Cloud-Init configs for a specific node.

        This can be used as a NoCloud data source.
      properties:
        user_data:
          type: string
          format: uuid
          nullable: true
          description: User data config to assign to the node. Supported MIME types
            are based on the operating system's `cloud-init` service version.
        user_data_name:
          type: string
          readOnly: true
          description: Name of the assigned user-data config.
        meta_data:
          type: string
          format: uuid
          nullable: true
          description: Meta data config to assign to the node (specific to NoCloud
            datasource).
        meta_data_name:
          type: string
          readOnly: true
          description: Name of the assigned meta-data config.
      required:
      - meta_data_name
      - user_data_name
    CompleteUploadPart:
      type: object
      description: Serializer for individual part in complete upload request.
      properties:
        part_number:
          type: integer
          maximum: 10000
          minimum: 1
          description: The part number (1-10000).
        etag:
          type: string
          description: The ETag returned by S3 after uploading the part.
          minLength: 1
      required:
      - etag
      - part_number
    ConfirmedUserData:
      type: object
      description: Serializer for a confirmed user in an external user group.
      properties:
        email:
          type: string
          description: Email address of the user.
        idpName:
          type: string
          description: Identity provider name.
        isAdmin:
          type: boolean
          description: Whether the user is an admin.
        userSince:
          type: string
          description: Date when the user joined.
        userId:
          type: string
          description: Unique identifier for the user.
        idpType:
          type: string
          description: Type of identity provider.
        lastLoginDate:
          type: string
          description: Date of the user's last login.
      required:
      - email
      - idpName
      - idpType
      - isAdmin
      - userId
      - userSince
    Contract:
      type: object
      description: Data summarizing a Metronome contract.
      properties:
        contract_id:
          type: string
          readOnly: true
        service_name:
          type: string
          readOnly: true
        nca_id:
          type: string
          readOnly: true
        purchase_order:
          type: string
          readOnly: true
        external_id:
          type: string
          readOnly: true
        contract_type:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        starting_at:
          type: string
          format: date-time
          readOnly: true
        ending_before:
          type: string
          format: date-time
          readOnly: true
      required:
      - contract_id
      - contract_type
      - created_at
      - ending_before
      - external_id
      - nca_id
      - purchase_order
      - service_name
      - starting_at
    CpuArchEnum:
      enum:
      - x86
      - ARM
      type: string
      description: |-
        * `x86` - x86
        * `ARM` - ARM
    CpuModeEnum:
      enum:
      - custom
      - host-model
      - host-passthrough
      type: string
      description: |-
        * `custom` - Custom CPU mode which can include custom CPU options.
        * `host-model` - CPU mode which attempts to select a CPU model resembling the hypervisor's CPU model as closely as possible.
        * `host-passthrough` - CPU mode which exposes all details of the hypervisor's CPU model.
    CpuOptionsEnum:
      enum:
      - ssse3
      - sse4.1
      - sse4.2
      - popcnt
      type: string
      description: |-
        * `ssse3` - ssse3
        * `sse4.1` - sse4.1
        * `sse4.2` - sse4.2
        * `popcnt` - popcnt
    DestinationFormatEnum:
      enum:
      - JSON
      type: string
      description: '* `JSON` - JSON format'
    DevicesEnum:
      enum:
      - /dev/kvm
      - /dev/net/tun
