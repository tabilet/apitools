    get:
      operationId: api_v3_simulations_nodes_instructions_list
      description: |-
        List instructions visible to your account.

        **Required scope:** `air:simulation_read` (roles: `air_org_admin`, `air_user`)

        **Alternative:** role `air_trainee` also grants access.
      summary: List instructions
      parameters:
      - in: query
        name: created_by_client
        schema:
          type: boolean
      - in: query
        name: executor
        schema:
          type: string
          enum:
          - file
          - init
          - shell
        description: |-
          * `init` - Initialize the node's hostname
          * `file` - Write files to the node's file system
          * `shell` - Execute shell commands on the node
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: name
        schema:
          type: string
      - in: query
        name: node
        schema:
          type: string
          format: uuid
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -created
          - -created_by_client
          - -executor
          - -id
          - -modified
          - -name
          - -node
          - -run_again_on_rebuild
          - -state
          - -wait_for_network
          - created
          - created_by_client
          - executor
          - id
          - modified
          - name
          - node
          - run_again_on_rebuild
          - state
          - wait_for_network
        description: Order instructions by field.
      - in: query
        name: run_again_on_rebuild
        schema:
          type: boolean
      - in: query
        name: search
        schema:
          type: string
        description: Search instructions by `name`.
      - in: query
        name: simulation
        schema:
          type: string
          format: uuid
      - in: query
        name: state
        schema:
          type: string
          enum:
          - CANCELLED
          - COMPLETE
          - FAILED
          - IN_PROGRESS
          - READY
        description: |-
          * `READY` - The instruction is ready to be picked up and executed.
          * `IN_PROGRESS` - The instruction has been picked up by the worker.
          * `COMPLETE` - The instruction was successfully executed.
          * `FAILED` - The instruction failed to finish execution.
          * `CANCELLED` - The READY instruction was cancelled.
      tags:
      - Instructions
      responses:
        '200':
