          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: ''
        '500':
