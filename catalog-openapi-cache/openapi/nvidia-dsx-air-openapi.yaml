    TopologyFormat:
      type: object
      description: Representation of a network topology.
      properties:
        nodes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/TopologyFormatNode'
          description: Nodes which are part of the topology.
        links:
          type: array
          items:
            type: array
            description: 'A link: [interface, interface | special_destination] or
              [interface, interface | special_destination, link_properties]'
            minItems: 2
            maxItems: 3
            items:
              oneOf:
              - type: object
                properties:
                  interface:
                    type: string
                    description: Name for the network interface. Must not be `eth0`.
                  node:
                    type: string
                    minLength: 1
                    description: Node that hosts this interface.
                  mac:
                    type: string
                    minLength: 1
                    description: MAC address to assign to this interface. If not specified,
                      one will be generated.
                  network_pci:
                    type: string
                    minLength: 1
                    description: Name for the network PCI entity this interface resides
                      on.
                  interface_role:
                    type: string
                    maxLength: 64
                    description: The role of the interface.
                  scalable_unit:
                    type: integer
                    minimum: 1
                    description: The scalable unit number that the node belongs to.
                required:
                - interface
                - node
              - type: string
                enum:
                - outbound
                - unconnected
                description: Special destination
              - type: object
                properties:
                  cable_length:
                    type: string
                    description: The length of the cable connecting the interfaces.
          example:
          - - interface: interface1
              node: node1
              mac: mac1
              network_pci: network_pci1
              interface_role: interface_role1
              scalable_unit: 1
            - interface: interface2
              node: node2
              mac: mac2
              network_pci: network_pci2
              interface_role: interface_role2
              scalable_unit: 1
          - - interface: interface1
              node: node1
              mac: mac1
              network_pci: network_pci1
              interface_role: interface_role1
              scalable_unit: 1
            - outbound
          - - interface: interface1
              node: node1
              mac: mac1
              network_pci: network_pci1
              interface_role: interface_role1
              scalable_unit: 1
            - interface: interface2
              node: node2
              mac: mac2
              network_pci: network_pci2
              interface_role: interface_role2
              scalable_unit: 1
            - cable_length: cable_length
          description: Connections between nodes defined in the topology.
        oob:
          allOf:
          - $ref: '#/components/schemas/TopologyFormatOOBField'
          description: Configuration of default Out-of-Band management network.
        netq:
          allOf:
          - $ref: '#/components/schemas/TopologyFormatNetQField'
          default: false
          description: Configuration of NetQ.
      required:
      - nodes
    TopologyFormatCoordinates:
      type: object
