        \ infrastructure nodes cannot be deleted while auto_oob_enabled or auto_netq_enabled\
        \ are True. If deleting these nodes results in zero primary network nodes\
        \ remaining (i.e., only OOB/NetQ infrastructure nodes remain), auto_oob_enabled\
        \ and auto_netq_enabled will automatically be set to False, and all OOB/NetQ\
