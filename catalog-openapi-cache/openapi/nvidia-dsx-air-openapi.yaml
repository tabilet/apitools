        Returns aggregate counts and total billed compute hours for billing records that match the same filters and period overlap as the list endpoint. The `query` object echoes sent query parameters.

        **Required role:** `air_org_admin`
      summary: Summarize billing records for an NGC organization
      parameters:
      - in: query
        name: billing_ended_at
        schema:
          type: string
          format: date-time
        description: Filter by when this billing window ended.
      - in: query
        name: billing_ended_at_isnull
        schema:
          type: boolean
        description: Filter by whether the billing record has an end time.
      - in: query
        name: billing_started_at
        schema:
          type: string
          format: date-time
        description: Filter by when this billing window began.
      - in: query
        name: created
        schema:
          type: string
          format: date-time
        description: Filter by the date the record was created.
      - in: query
        name: fleet_id
        schema:
          type: string
          format: uuid
        description: Filter by the fleet ID running the sim.
      - in: query
        name: fleet_name
        schema:
          type: string
        description: Filter by the fleet name running the sim.
      - in: query
        name: id
        schema:
          type: string
          format: uuid
        description: Filter by billing record ID.
      - in: query
        name: modified
        schema:
          type: string
          format: date-time
        description: Filter by the date the record was last modified.
      - in: query
        name: ngc_org_name
        schema:
          type: string
        description: Filter by the NGC organization name of the billed organization.
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -billing_ended_at
          - -billing_started_at
          - -created
          - -fleet_name
          - -modified
          - -ngc_org_name
          - -org_display_name
          - -sim_compute_hours_consumed
          - -sim_compute_hours_consumed_for_period
          - -sim_compute_hours_rate
          - -sim_cpu
          - -sim_creator
          - -sim_memory
          - -sim_name
          - -sim_owner
          - -sim_storage
          - billing_ended_at
          - billing_started_at
          - created
          - fleet_name
          - modified
          - ngc_org_name
          - org_display_name
          - sim_compute_hours_consumed
          - sim_compute_hours_consumed_for_period
          - sim_compute_hours_rate
          - sim_cpu
          - sim_creator
          - sim_memory
          - sim_name
          - sim_owner
          - sim_storage
        description: Order objects by field. Prefix with `-` for descending order.
      - in: query
        name: period_end
        schema:
          type: string
          format: date-time
        description: 'Specify the end of a window to filter billing records. Example:
          2026-01-31T23:59:59Z'
      - in: query
        name: period_start
        schema:
          type: string
          format: date-time
        description: 'Specify the start of a window to filter billing records. Example:
          2026-01-01T00:00:00Z'
      - in: query
        name: run_id
        schema:
          type: string
          format: uuid
        description: Filter by the run ID the billing record corresponds to.
      - in: query
        name: search
        schema:
          type: string
        description: Search by `sim_name`, `simulation_uuid`, `sim_owner`, `billing_started_at`,
          `billing_ended_at`, `sim_compute_hours_rate`, `sim_compute_hours_consumed`,
          `sim_compute_hours_consumed_for_period`, `sim_cpu`, `sim_memory`, or `sim_storage`.
      - in: query
        name: sim_compute_hours_consumed
        schema:
          type: number
        description: Filter by total compute hours consumed.
      - in: query
        name: sim_compute_hours_consumed_for_period
        schema:
          type: number
        description: Filter by compute hours consumed for the requested period.
      - in: query
        name: sim_compute_hours_rate
        schema:
          type: number
          format: float
        description: Filter by compute-hours rate applied while the sim was running.
      - in: query
        name: sim_cpu
        schema:
          type: integer
        description: Filter by total CPU allocated across all nodes while the sim
          was running.
      - in: query
        name: sim_creator
        schema:
          type: string
        description: Filter by creator of the simulation.
      - in: query
        name: sim_memory
