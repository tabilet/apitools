  /api/v3/images/claim-image-share/:
    post:
      operationId: api_v3_images_claim_image_share_create
      description: |-
        This endpoint allows you to claim an image share provided to your organization by another organization using NVIDIA Air. The `image_share` payload value is the `id` of the image share instance the source organization created. The claim process will create a new image in your organization and asynchronously copy the image content from the source organization.

        **Process:**
        1. The image is duplicated with your organization as the owner
        2. Image content is copied asynchronously in the background
        3. The image share record is deleted upon successful claim
        4. The new image will transition from `COPYING_FROM_IMAGE_SHARE` to `COMPLETE` once the content transfer finishes

        **Note:** Only non-expired shares for your specific organization can be claimed.

        **Required scopes (any one):**

        - `air:image_write` (roles: `air_image_publisher`, `air_image_uploader`)
        - `air:image_claiming` (roles: `air_image_claimer`)
      summary: Claim an image share, copying the image to your org
      tags:
      - Images
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimImageShare'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClaimImageShare'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClaimImageShare'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageReadUpdate'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
          description: ''
