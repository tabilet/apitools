openapi: 3.0.3
info:
  title: NVIDIA Air API
  version: v0.1.0
  description: Interactive documentation for the NVIDIA Air Platform API.
paths:
  /api/v3/announcements/:
    get:
      operationId: api_v3_announcements_list
      description: |-
        Lists announcements visible to the user. Only admin clients will see `INACTIVE` announcements. Results are ordered by creation date (newest first) by default.

        **Permissions:** Any authenticated user with an Air scope.
      summary: List global announcements
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -created
          - -modified
          - -severity
          - -state
          - created
          - modified
          - severity
          - state
        description: Order results by a specific field. Prefix with "-" for descending
          order.
      - in: query
        name: search
        schema:
          type: string
        description: Search by text in the `message`.
      - in: query
        name: severity
        schema:
          type: string
          enum:
          - ALERT
          - INFO
        description: |-
          Filter by severity.

          * `INFO` - Info
          * `ALERT` - Alert
      - in: query
        name: state
        schema:
          type: array
          items:
            type: string
            enum:
            - ACTIVE
            - INACTIVE
        description: Filter by state (can specify multiple values). Only admin clients
          will see `INACTIVE` announcements.
        explode: false
        style: form
      tags:
      - Announcements
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAnnouncementsList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
          description: ''
    post:
      operationId: api_v3_announcements_create
      description: |-
        Creates a global announcement. Used to display announcements to the user.

        **Required scope:** `air:sre` (roles: `air_sre`)
      summary: Create a global announcement
      tags:
      - Announcements
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Announcements'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Announcements'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Announcements'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcements'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
          description: ''
  /api/v3/announcements/{id}/:
    patch:
      operationId: api_v3_announcements_partial_update
      description: |-
        Updates individual fields of an announcement.

        **Required scope:** `air:sre` (roles: `air_sre`)
      summary: Update individual fields of an announcement
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this announcements.
        required: true
      tags:
      - Announcements
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAnnouncements'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAnnouncements'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAnnouncements'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcements'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
          description: ''
    delete:
      operationId: api_v3_announcements_destroy
      description: |-
        Deletes a global announcement. Used to delete announcements from the user.

        **Required scope:** `air:sre` (roles: `air_sre`)
      summary: Delete a global announcement
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this announcements.
        required: true
      tags:
      - Announcements
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
          description: ''
  /api/v3/billing-records/:
    get:
      operationId: api_v3_billing_records_list
      description: |-
        Review detailed information about billing usage data over a given time period for running simulations. The actual compute hours consumed per simulation during the specified period will be reflected in the `sim_compute_hours_consumed_for_period` field, and the total compute hours consumed for the entire run of that simulation will be reflected in the `sim_compute_hours_consumed` field.

        **Required role:** `air_org_admin`
      summary: List billing records for an NGC organization
      parameters:
      - in: query
        name: billing_ended_at
        schema:
          type: string
          format: date-time
        description: Filter by when this billing window ended.
      - in: query
        name: billing_ended_at_isnull
        schema:
          type: boolean
        description: Filter by whether the billing record has an end time.
      - in: query
        name: billing_started_at
        schema:
          type: string
          format: date-time
        description: Filter by when this billing window began.
      - in: query
        name: created
        schema:
          type: string
          format: date-time
        description: Filter by the date the record was created.
      - in: query
        name: fleet_id
        schema:
          type: string
          format: uuid
        description: Filter by the fleet ID running the sim.
      - in: query
        name: fleet_name
        schema:
          type: string
        description: Filter by the fleet name running the sim.
      - in: query
        name: id
        schema:
          type: string
          format: uuid
        description: Filter by billing record ID.
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: modified
        schema:
          type: string
          format: date-time
        description: Filter by the date the record was last modified.
      - in: query
        name: ngc_org_name
        schema:
          type: string
        description: Filter by the NGC organization name of the billed organization.
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -billing_ended_at
          - -billing_started_at
          - -created
          - -fleet_name
          - -modified
          - -ngc_org_name
          - -org_display_name
          - -sim_compute_hours_consumed
          - -sim_compute_hours_consumed_for_period
          - -sim_compute_hours_rate
          - -sim_cpu
          - -sim_creator
          - -sim_memory
          - -sim_name
          - -sim_owner
          - -sim_storage
          - billing_ended_at
          - billing_started_at
          - created
          - fleet_name
          - modified
          - ngc_org_name
          - org_display_name
          - sim_compute_hours_consumed
          - sim_compute_hours_consumed_for_period
          - sim_compute_hours_rate
          - sim_cpu
          - sim_creator
          - sim_memory
          - sim_name
          - sim_owner
          - sim_storage
        description: Order objects by field. Prefix with `-` for descending order.
      - in: query
        name: period_end
        schema:
          type: string
          format: date-time
        description: 'Specify the end of a window to filter billing records. Example:
          2026-01-31T23:59:59Z'
      - in: query
        name: period_start
        schema:
          type: string
          format: date-time
        description: 'Specify the start of a window to filter billing records. Example:
          2026-01-01T00:00:00Z'
      - in: query
        name: run_id
        schema:
          type: string
          format: uuid
        description: Filter by the run ID the billing record corresponds to.
      - in: query
        name: search
        schema:
          type: string
        description: Search by `sim_name`, `simulation_uuid`, `sim_owner`, `billing_started_at`,
          `billing_ended_at`, `sim_compute_hours_rate`, `sim_compute_hours_consumed`,
          `sim_compute_hours_consumed_for_period`, `sim_cpu`, `sim_memory`, or `sim_storage`.
      - in: query
        name: sim_compute_hours_consumed
        schema:
          type: number
        description: Filter by total compute hours consumed.
      - in: query
        name: sim_compute_hours_consumed_for_period
        schema:
          type: number
        description: Filter by compute hours consumed for the requested period.
      - in: query
        name: sim_compute_hours_rate
        schema:
          type: number
          format: float
        description: Filter by compute-hours rate applied while the sim was running.
      - in: query
        name: sim_cpu
        schema:
          type: integer
        description: Filter by total CPU allocated across all nodes while the sim
          was running.
      - in: query
        name: sim_creator
        schema:
          type: string
        description: Filter by creator of the simulation.
      - in: query
        name: sim_memory
        schema:
          type: integer
        description: Filter by total memory (MiB) allocated across all nodes while
          the sim was running.
      - in: query
        name: sim_name
        schema:
          type: string
        description: Filter by simulation name.
      - in: query
        name: sim_owner
        schema:
          type: string
        description: Filter by owner of the simulation. Same as the creator unless
          the sim is assigned to someone else.
      - in: query
        name: sim_storage
        schema:
          type: integer
        description: Filter by total storage (GB) allocated across all nodes while
          the sim was running.
      - in: query
        name: simulation_uuid
        schema:
          type: string
          format: uuid
        description: Filter by simulation ID.
      tags:
      - Billing
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBillingRecordList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
          description: ''
  /api/v3/billing-records/summary/:
