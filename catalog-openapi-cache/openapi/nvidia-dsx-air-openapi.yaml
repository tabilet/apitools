        \ field. Node IDs must be unique (no duplicates) and all nodes must belong\
        \ to the specified simulation. For plugin nodes, if a child plugin node is\
        \ deleted, its parent must also be included in the payload, and vice versa.\n\
        \n**Required scope:** `air:simulation_edit` (roles: `air_org_admin`, `air_user`)"
      summary: Delete nodes in bulk
      tags:
