          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
          description: ''
    post:
      operationId: api_v3_marketplace_demos_create
      description: |-
        Create a blank marketplace demo. Provided `simulation` must be in the `INACTIVE` state. Provided `checkpoint` must be in the `COMPLETE` state and must belong to the provided `simulation`. If not provided, the most recent complete checkpoint will be used. This simulation will be cloned into a new simulation set to `DEMO` state.

