  /api/v3/simulations/{id}/shutdown/:
    patch:
      operationId: api_v3_simulations_shutdown_partial_update
      description: |-
        This endpoint is used to shutdown a simulation. By default, the simulation will save its progress as a new checkpoint and perform the following state transitions: `ACTIVE` -> `PREPARE_SHUTDOWN` -> `SHUTTING_DOWN` -> `SAVING` -> `INACTIVE`. If necessary, Air may delete an existing checkpoint of your simulation to make room for the newly created checkpoint; if this happens, Air will prefer to keep favorited checkpoints over non-favorited checkpoints and more recently created checkpoints over older checkpoints.

        If `create_checkpoint` is set to false in the payload, the simulation will not create a checkpoint and will instead perform the following state transitions: `ACTIVE` -> `PREPARE_PURGE` -> `PURGING` -> `INACTIVE`.

        **Required scope:** `air:simulation_start_stop` (roles: `air_org_admin`, `air_user`)

        **Alternative:** role `air_trainee` also grants access.
      summary: Begins shutting down the simulation
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this simulation.
        required: true
      tags:
      - Simulations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSimulationShutdown'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSimulationShutdown'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSimulationShutdown'
      responses:
        '200':
          content:
            application/json:
