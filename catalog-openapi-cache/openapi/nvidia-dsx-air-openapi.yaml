  /api/v3/simulations/clone/:
    post:
      operationId: api_v3_simulations_clone_create
      description: "Cloning a simulation will create a new replica of the simulation\
        \ which is completely independent of the original simulation. \n\nAn optional\
        \ `checkpoint` value may be specified in the payload in order to copy a checkpoint\
        \ from the original simulation onto the new simulation. If `checkpoint` is\
        \ excluded from the payload, the most recent checkpoint of the simulation\
        \ will be used; if the `null` value is provided, no checkpoint will be used\
        \ and the simulation will perform an initial boot the first time it is started.\
        \ \n\nIf you would like to attempt to start the new sim immediately after\
        \ cloning, provide true for the `attempt_start` value in your payload; even\
        \ if `attempt_start` is set to true, the sim may not start if Air or your\
        \ organization does not have sufficient credit/resources. The `attempt_start`\
        \ option does not apply for simulations being cloned to a demo. \n\nAn optional\
        \ `name` value may be provided in the payload to set the name of the new simulation.\
        \ If omitted, the new simulation will inherit the name of the original simulation.\n\
        \n**Required scope:** `air:simulation_create` (roles: `air_org_admin`, `air_user`)"
      summary: Clone a simulation
      tags:
      - Simulations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulationClone'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SimulationClone'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SimulationClone'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
